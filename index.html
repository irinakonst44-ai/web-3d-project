<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>лаб6</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #808080;
      color: #222;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
    }

    model-viewer {
      width: 100%;
      height: 600px;
      background: #800000;
      border-radius: 16px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Камни мира одного человека</h1>

    <p>
      Рассмотрите камень со всех сторон.
      Используйте мышь для вращения и приближения.
    </p>

    <model-viewer
      src="assets/model.glb"
      alt="Трёхмерная модель проекта"
      camera-controls
      auto-rotate
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1">
    </model-viewer>

  </main>
</body>
</html>
